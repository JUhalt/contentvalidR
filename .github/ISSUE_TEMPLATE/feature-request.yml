name: Feature request
description: Propose a new capability or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Researcher need
      description: What substantive/content-validity or scale-pretesting problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the behavior or workflow you would like contentvalidR to support.
    validations:
      required: true
  - type: textarea
    id: methods
    attributes:
      label: Methodological basis
      description: If applicable, identify statistical methods, estimands, references, or existing implementations.
  - type: textarea
    id: philosophy
    attributes:
      label: Researcher-control considerations
      description: Note any decisions the package should expose rather than automate.